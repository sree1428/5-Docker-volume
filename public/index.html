<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>📸 Photo Gallery</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 { color: #333; }
    .upload-box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      border: 2px dashed #ccc;
      text-align: center;
      margin-bottom: 30px;
    }
    input[type=file] { margin: 10px 0; }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover { background: #45a049; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 15px;
    }
    .photo-card {
      background: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .photo-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }
    .photo-card .info {
      padding: 10px;
      font-size: 12px;
      color: #666;
      word-break: break-all;
    }
    .photo-card button {
      background: #e74c3c;
      width: 100%;
      border-radius: 0;
      padding: 8px;
      font-size: 13px;
    }
    #status { margin: 10px 0; font-weight: bold; }
  </style>
</head>
<body>
  <h1>📸 Photo Gallery</h1>

  <div class="upload-box">
    <h3>Upload a photo</h3>
    <input type="file" id="photoInput" accept="image/*" />
    <br />
    <button onclick="uploadPhoto()">Upload</button>
    <div id="status"></div>
  </div>

  <h3>Uploaded Photos</h3>
  <div class="gallery" id="gallery"></div>

  <script>
    async function uploadPhoto() {
      const input = document.getElementById('photoInput');
      const status = document.getElementById('status');

      if (!input.files[0]) {
        status.textContent = '⚠️ Please choose a file first';
        return;
      }

      const formData = new FormData();
      formData.append('photo', input.files[0]);

      status.textContent = '⏳ Uploading...';

      try {
        const res = await fetch('/upload', {
          method: 'POST',
          body: formData,
        });
        const data = await res.json();
        if (res.ok) {
          status.textContent = '✅ Uploaded: ' + data.filename;
          input.value = '';
          loadGallery();
        } else {
          status.textContent = '❌ ' + data.error;
        }
      } catch (err) {
        status.textContent = '❌ Error: ' + err.message;
      }
    }

    async function loadGallery() {
      const res = await fetch('/photos');
      const data = await res.json();

      const gallery = document.getElementById('gallery');
      gallery.innerHTML = '';

      if (data.photos.length === 0) {
        gallery.innerHTML = '<p>No photos yet. Upload one! ⬆️</p>';
        return;
      }

      data.photos.forEach((p) => {
        const card = document.createElement('div');
        card.className = 'photo-card';
        card.innerHTML = `
          <img src="${p.url}" alt="${p.filename}" />
          <div class="info">
            ${p.filename}<br />
            ${(p.size / 1024).toFixed(1)} KB
          </div>
          <button onclick="deletePhoto('${p.filename}')">Delete</button>
        `;
        gallery.appendChild(card);
      });
    }

    async function deletePhoto(filename) {
      if (!confirm('Delete this photo?')) return;
      await fetch('/photos/' + filename, { method: 'DELETE' });
      loadGallery();
    }

    // Load photos on page open
    loadGallery();
  </script>
</body>
</html>
